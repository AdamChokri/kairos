[project]
name = "kairos-api"
version = "0.1.0"
description = "Kairos v0 - task manager API (as-is state with seeded weaknesses, see security/seeded-vulns.md)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pyjwt==2.15.0",
    "pyyaml==6.0.3",
    "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx2==2.16.0",
    "ruff==0.17.3",
    "bandit==1.9.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
