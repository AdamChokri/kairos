# infra/lab/provision.conf - the project folder on each Hyper-V host (provision-vms.sh).
# Sourced by provision-vms.sh, authorize-optiplex-key.sh, build-seeds.sh and fetch-release.sh;
# every value can be overridden from the environment. Each host's folder holds: golden\ (the golden
# VHDX), seeds\ (the NoCloud ISOs), Hyper-V\ (the VMs and their disks), vms.csv and New-LabVM.ps1.
# The Legion's folder is the whole project (D-21): the repository is its kairos\ subfolder, next
# to iso\ (the Ubuntu image), openbao\ (verified releases) and guides\; WSL2 sees it as LAB_HOME_WSL.
# shellcheck shell=bash
# shellcheck disable=SC2034  # read by the scripts that source this file
: "${LAB_ROOT_LEGION:=D:\\Projects\\Kairos}"
: "${LAB_ROOT_OPTIPLEX:=C:\\Projects\\Kairos}"
: "${GOLDEN_NAME:=ubuntu-24.04-golden.vhdx}"
# The Legion's folder as WSL2 sees it (/mnt/d/Projects/Kairos); empty outside WSL2.
: "${LAB_HOME_WSL:=$(wslpath -u "$LAB_ROOT_LEGION" 2>/dev/null || true)}"
# How scp names a Windows path on the OptiPlex: "C:/Projects/..." (prefix empty) or "/C:/Projects/..."
# (prefix "/"). authorize-optiplex-key.sh tests both in WP0.2 and tells you which one to keep.
: "${LAB_SCP_PREFIX:=}"
