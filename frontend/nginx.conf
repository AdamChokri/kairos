# Kairos web tier (plan WP4.5, SV-09): the static build, and the API under /api.
# nginx-unprivileged includes this file in its http block and listens on 8080 as UID 101.
# TLS and the security headers are not part of this project (SV-08 stays as the baseline records it).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # What every request to the API carries (inherited by the locations below).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    # The API: the browser talks to this server only. The body limit is a little above the API's own (100 kB).
    location /api/ {
        client_max_body_size 200k;
        proxy_pass http://api:8000;
    }

    # Health and the API's description, for the smoke tests.
    location = /healthz {
        proxy_pass http://api:8000/healthz;
    }
    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The single-page app: every other path is the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
