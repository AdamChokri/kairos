# Kairos v0 - the as-is stack (plan WP2.1, SV-09). The same file runs on the Legion
# (docker compose -f deploy/compose.yaml up --build) and on staging and production
# (the as-is pipeline copies it next to .env, pulls and starts).
#   - the API on 8000 and the Vite dev server on 5173 are published on 0.0.0.0;
#   - no resource limits, no read-only root filesystem, capabilities and users at Docker's defaults;
#   - images are the mutable :latest of the user's Docker Hub namespace (DOCKERHUB_USER).
name: kairos

services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ../backend
    image: ${DOCKERHUB_USER:-local}/kairos-api:latest
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../frontend
    image: ${DOCKERHUB_USER:-local}/kairos-web:latest
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db-data:
