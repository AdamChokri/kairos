---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted

- name: Apply the DOCKER-USER allow-list
  ansible.builtin.command: /usr/local/sbin/kairos-docker-allowlist
  changed_when: true
