# infra/ansible/ansible.cfg - run every playbook from this folder in WSL2 (plan WP1.2), so this
# file is honoured: cd infra/ansible && ansible-playbook site.yml
[defaults]
inventory = inventory.yml
roles_path = roles
remote_user = adam
private_key_file = ~/.ssh/kairos_admin
host_key_checking = True
interpreter_python = /usr/bin/python3
forks = 7
callback_result_format = yaml
nocows = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes
