# Kairos - the Compose stack (plan WP2.1, SV-09).
# Secrets are files, never environment values (SV-01, WP4.5): Compose mounts each one under /run/secrets, and the
# API and the database read them through <NAME>_FILE. On the Legion, `make dev-up` first makes throwaway files in
# .dev-secrets/ (ci/tools/dev-secrets.sh); on staging and production KAIROS_SECRETS_DIR is /etc/kairos/secrets,
# where the OpenBao Agent renders them (WP5.3).
#   - the API on 8000 and the Vite dev server on 5173 are published on 0.0.0.0;
#   - no resource limits, no read-only root filesystem, capabilities and users at Docker's defaults;
#   - images are the mutable :latest of the user's Docker Hub namespace (DOCKERHUB_USER).
# The last three lines are the seeded weakness SV-09, still here: WP4.5 hardens them in the next pull request.
name: kairos

services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: kairos
      POSTGRES_DB: kairos
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ../backend
    image: ${DOCKERHUB_USER:-local}/kairos-api:latest
    restart: always
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: kairos
      POSTGRES_DB: kairos
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      GIT_SHA: ${GIT_SHA:-dev}
    secrets:
      - db_password
      - jwt_secret_key
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../frontend
    image: ${DOCKERHUB_USER:-local}/kairos-web:latest
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - api

secrets:
  db_password:
    file: ${KAIROS_SECRETS_DIR:-../.dev-secrets}/db_password
  jwt_secret_key:
    file: ${KAIROS_SECRETS_DIR:-../.dev-secrets}/jwt_secret_key

volumes:
  db-data:
