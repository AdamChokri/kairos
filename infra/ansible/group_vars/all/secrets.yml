# infra/ansible/group_vars/all/secrets.yml - where Ansible reads secrets: OpenBao, never this file.
# Each value is fetched in WSL2 with your own `bao` login, only when a task uses it, and every task
# that uses one has no_log: true. Nothing below is a secret.
#   bao login -no-print -method=userpass username=adam    (before running a play that needs one)
openbao_kv_read: "bao kv get -format=json"

# kv/infra/dockerhub-ro: username, token - Docker Hub read-only token (WP0.1, WP1.3)
secret_dockerhub_ro: "{{ (lookup('ansible.builtin.pipe', openbao_kv_read ~ ' kv/infra/dockerhub-ro') | from_json).data.data }}"
# kv/infra/jenkins-agents: build_secret, deploy_secret - the agents' connection secrets (WP1.4)
secret_jenkins_agents: "{{ (lookup('ansible.builtin.pipe', openbao_kv_read ~ ' kv/infra/jenkins-agents') | from_json).data.data }}"
# kv/infra/wazuh: passwords, their bcrypt hashes, enrollment password, Slack webhook (WP1.6)
secret_wazuh: "{{ (lookup('ansible.builtin.pipe', openbao_kv_read ~ ' kv/infra/wazuh') | from_json).data.data }}"
# kv/infra/as-is-deploy: password - the as-is "deploy" account's password on staging and production (WP2.2, SV-11)
secret_as_is_deploy: "{{ (lookup('ansible.builtin.pipe', openbao_kv_read ~ ' kv/infra/as-is-deploy') | from_json).data.data }}"
# kv/infra/ngrok: authtoken, domain, webhook_secret - the ngrok agent on dso-jenkins (WP4.8, D-45)
secret_ngrok: "{{ (lookup('ansible.builtin.pipe', openbao_kv_read ~ ' kv/infra/ngrok') | from_json).data.data }}"
