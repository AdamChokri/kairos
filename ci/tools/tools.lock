# ci/tools/tools.lock - every scanner and build image the pipeline runs, by digest (plan WP4.2, D-08, D-12).
# Columns, separated by spaces: name  image:tag  digest  pushed  verified-by
#   pushed   the date the registry says the tag was last pushed; the tag must be at least 7 days old when pinned (D-12)
#   digest   the multi-platform index digest, as `ci/tools/resolve-digest.sh` prints it; a digest of zeros is a
#            placeholder that ci/scripts/lib.sh refuses
# The Node image is not repeated here: ci/tools/node-image.txt stays its only pin (D-30).
# Versions that also appear elsewhere (Trivy, Gitleaks, Hadolint, Semgrep, Bandit, Ruff) are compared with
# those places by ci/tools/check-tools-lock.sh, so the hooks, `make` and the pipeline run the same tools.
# Refresh with ci/tools/pin-tools.sh in its own pull request; ci/tools/denylist.txt lists what must never be pinned.
