rules:
  - id: kairos.hardcoded-jwt-secret
    languages: [python]
    severity: ERROR
    message: >-
      A token signing key is written in the source code. What: anyone who can read the repository
      (and this one is public) or the image can sign a valid token for any user. Why it matters:
      the key cannot be rotated without a code change, and a leaked copy stays in the Git history
      for good. How to fix: read the key at run time from a secret file or the environment
      (JWT_SECRET_KEY_FILE), keep it out of the repository, and rotate it if it was ever
      committed. Guide: docs/secure-coding.md#hard-coded-secrets
    metadata:
      category: security
      owasp:
        - "A04:2025 Cryptographic Failures"
        - "A07:2025 Authentication Failures"
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-321: Use of Hard-coded Cryptographic Key"
      asvs:
        - "v5.0.0-13.3.1"
        - "v5.0.0-9.1.3"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      seeded: SV-01
      guide: docs/secure-coding.md#hard-coded-secrets
      references:
        - https://github.com/AdamChokri/kairos/blob/main/docs/secure-coding.md#hard-coded-secrets
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $NAME = $VAL
              - pattern: "$NAME: $T = $VAL"
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i)^(jwt|token|signing|auth|session|secret)[a-z0-9_]*(key|secret)$
          - metavariable-regex:
              metavariable: $VAL
              regex: ^["'][^"']{16,}["']$
      - pattern: jwt.encode($PAYLOAD, "...", ...)
      - pattern: jwt.decode($TOKEN, "...", ...)
